services:
  backend:
    build: . # O la imagen que uses
    container_name: fichaje-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db # <--- IMPORTANTE: Debe ser el nombre del servicio en el otro archivo
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SEED_SECRET_KEY: ${SEED_SECRET_KEY}
      MAX_FICHAR_DISTANCE: ${MAX_FICHAR_DISTANCE}
      DEFAULT_DAYS_ISSUES: ${DEFAULT_DAYS_ISSUES}
      DEFAULT_DAYS_REQUESTS: ${DEFAULT_DAYS_REQUESTS}
    networks:
      - fichaje-network

networks:
  fichaje-network:
    external: true
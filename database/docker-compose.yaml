services:
  postgres:
    image: postgres:14.3
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fichaje-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fichaje_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cticontrol.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - fichaje-network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  fichaje-network:
    driver: bridge
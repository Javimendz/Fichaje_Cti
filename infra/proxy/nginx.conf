worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    # DNS interno de Docker (asíncrono) para resolver contenedores dinámicamente
    resolver 127.0.0.11 valid=30s;

    # =========================================================================
    # 💻 LOCAL: ENTORNO "PRODUCCIÓN" (http://localhost)
    # =========================================================================
    server {
        listen 80;
        server_name localhost;

        # API - Redirección al Backend de Producción Local
        location /api/ {
            set $backend_prod "http://fichaday_backend:3000";
            proxy_pass $backend_prod;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Raíz - Redirección al Frontend de Producción Local
        location / {
            set $frontend_prod "http://fichaje-frontend-prod:3000";
            proxy_pass $frontend_prod;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # =========================================================================
    # 🧪 LOCAL: ENTORNO "TEST" (http://localhost:8080)
    # =========================================================================
    server {
        listen 8080;
        server_name localhost;

        # Raíz - Redirección al Frontend de Test Local
        location / {
            set $frontend_test "http://fichaje-frontend-test:3000";
            proxy_pass $frontend_test;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # API - Redirección al Backend de Test Local
        location /api/ {
            set $backend_test_api "http://fichaday_backend_test:3000";
            proxy_pass $backend_test_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
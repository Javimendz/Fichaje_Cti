
services:

  db:
    image: postgres:14.3
    restart: always
    ports: 
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRESS_DB: ${DB_NAME}
      POSTGRESS_USERNAME: ${DB_USERNAME}
      POSTGRESS_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SEED_SECRET_KEY: ${SEED_SECRET_KEY}
      MAX_FICHAR_DISTANCE: ${MAX_FICHAR_DISTANCE}
      DEFAULT_DAYS_ISSUES: ${DEFAULT_DAYS_ISSUES}
      DEFAULT_DAYS_REQUESTS: ${DEFAULT_DAYS_REQUESTS}
    container_name: postgresDB_Fichaje
    env_file:
      - .env
    volumes:
      # - /postgres:/var/lib/postgresql/data
        - ./postgres-data:/var/lib/postgresql/data
services:
  postgres:
    image: postgres:14.3
    container_name: postgres_bbdd
    restart: always
    env_file:
      - .env.bbdd
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data_bbdd:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - red_fichaje # 👈 Usamos el nombre de la red global

networks:
  red_fichaje:
    external: true # 👈 Le decimos que ya existe
volumes:
  postgres_data_bbdd:
    driver: local
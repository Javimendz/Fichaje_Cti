version: '3.8'

services:
  postgres_db: # <--- Este nombre será tu DB_HOST
    image: postgres:14.3
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fichaje-network

volumes:
  postgres_data:
networks:
  fichaje-network:
    external: true # Indica que la red ya fue creada manualmente
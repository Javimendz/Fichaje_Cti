worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    # El DNS interno de Docker
    resolver 127.0.0.11 valid=30s;

    # =========================================================================
    # 💻 LOCAL: ENTORNO "PRODUCCIÓN" (Entra desde http://localhost)
    # =========================================================================
    server {
        listen 80;
        server_name localhost;

        # API apunta al nombre real de tu backend de producción
        location /api/ {
            set $backend_prod "http://fichaje_backend:3000";
            proxy_pass $backend_prod;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Raíz apunta al frontend de producción (si lo levantas)
        location / {
            set $frontend_prod "http://fichaje-frontend-prod:3000";
            proxy_pass $frontend_prod;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # =========================================================================
    # 🧪 LOCAL: ENTORNO "TEST" (Entra desde http://localhost:8080)
    # =========================================================================
    server {
        listen 8080;
        server_name localhost;

        # API apunta al nombre real de tu backend de test
        location /api/ {
            set $backend_test_api "http://fichaje_backend_test:3000";
            proxy_pass $backend_test_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Raíz apunta al frontend de test (si lo levantas)
        location / {
            set $frontend_test "http://fichaje-frontend-test:3000";
            proxy_pass $frontend_test;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
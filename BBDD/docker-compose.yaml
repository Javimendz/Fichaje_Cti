services:
  postgres:
    image: postgres:14.3
    container_name: postgres_bbdd
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data_bbdd:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432" #
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - red_fichaje 

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_bbdd
    restart: always
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80" # Mapea el puerto 5050 de tu VPS al 80 interno de pgAdmin
    networks:
      - red_fichaje
    depends_on:
      - postgres

networks:
  red_fichaje:
    name: red_fichaje # 👈 Esto obliga a Docker a buscar "red_fichaje" sin prefijos
    external: true
volumes:
  postgres_data_bbdd:
    driver: local
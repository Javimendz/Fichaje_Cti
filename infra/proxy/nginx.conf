# Configuración global de rendimiento
worker_processes auto;
worker_rlimit_nofile 8192; # 👈 Permite manejar miles de archivos simultáneos

events {
    worker_connections 2048; # 🚀 Capacidad para 2048 conexiones por worker
    multi_accept on;
    use epoll;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Optimización de transferencia de datos
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Definición del Backend (NestJS)
    upstream backend_api {
        server fichaje_backend:3000;
        keepalive 32; # 💡 Mantiene tuberías abiertas con NestJS para no saturar sockets
    }

    # 🛡️ Rate Limiting Corregido (50 peticiones/seg es seguro para tu App)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

    # Compresión Gzip para que el WebView cargue más rápido
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    server {
        listen 80;
        server_name cworker1.cticontrol.com;

        # Configuración de ráfaga (Permite picos de hasta 100 peticiones de golpe)
        limit_req zone=api_limit burst=100 nodelay;

        # Security Headers (Mantenemos los tuyos)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

        # 1. Rutas de la API
        location /api/ {
            proxy_pass http://backend_api;
            
            # 🚀 Configuración para Keepalive (Vital para que no pete)
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Ajuste de Timeouts (Damos margen al backend para cálculos pesados)
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # 2. Health Check (Sin logs para no ensuciar)
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # 3. Archivos Estáticos (Optimizado con Caché)
        location /static/ {
            alias /var/www/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # 4. Ruta por defecto (Redirige al Backend/Frontend)
        location / {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Páginas de error amigables
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }

    # 🔒 BLOQUE HTTPS (Recomendado para Geofencing)
    # Una vez tengas certificados, descomenta esto:
    # server {
    #     listen 443 ssl http2;
    #     server_name cworker1.cticontrol.com;
    #     ssl_certificate /etc/letsencrypt/live/cworker1.cticontrol.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/cworker1.cticontrol.com/privkey.pem;
    #     location / {
    #         proxy_pass http://backend_api;
    #         # ... (mismos proxy_set_header que arriba)
    #     }
    # }
}
services:
  proxy:
    image: nginx:1.25-alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"   # Puerto para el mundo exterior
      - "443:443" # Reservado para cuando pongas el SSL
    volumes:
      # Montamos tu archivo de config sobre el de por defecto de Nginx
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Importante: si usas la ruta /var/www/static/, crea esa carpeta o bórrala de la config
    networks:
      - red_fichaje
      - test_network

networks:
  red_fichaje:
    external: true
  test_network:
    name: bbdd_test_network # 🚩 LA MAGIA: Le decimos a Docker el nombre real que debe buscar
    external: true
# 🔐 PostgreSQL Host-Based Authentication - Fichaje CTI
# Configuración de acceso y autenticación

# 📋 FORMATO: type database user address method

# 🔄 Conexiones locales (Unix domain socket)
local   all             postgres                                peer
local   all             all                                     md5

# 🌐 Conexiones IPv4
host    all             all             127.0.0.1/32            md5
host    all             all             0.0.0.0/0               md5

# 🌐 Conexiones IPv6
host    all             all             ::1/128                 md5

# 🔗 Conexiones de replicación (si se necesita en el futuro)
host    replication     replicator      0.0.0.0/0               md5

version: '3.8'
services:
  backend:
    image: javierm735/fichaje-backend:latest
    container_name: fichaje-backend-prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      DB_HOST: postgres_db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      NODE_ENV: production
      APP_PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN}
      TZ: ${TZ}
      SEED_SECRET_KEY: ${SEED_SECRET_KEY}
      MAX_FICHAR_DISTANCE: ${MAX_FICHAR_DISTANCE}
      DEFAULT_DAYS_ISSUES: ${DEFAULT_DAYS_ISSUES}
      DEFAULT_DAYS_REQUESTS: ${DEFAULT_DAYS_REQUESTS}
    networks:
      - fichaje-network
    depends_on:
      - postgres-wait

  postgres-wait:
    image: alpine:latest # Más ligera y garantizada
    container_name: postgres-wait
    command: >
      sh -c "while ! nc -z postgres_db 5432; do echo 'Esperando DB...'; sleep 2; done; exit 0;"
    networks:
      - fichaje-network

networks:
  fichaje-network:
    external: true
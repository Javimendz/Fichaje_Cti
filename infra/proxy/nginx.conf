worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    upstream backend_prod {
        server fichaday_backend:3000;
    }

    upstream backend_test {
        server fichaje_backend_test:3000;
    }

    # SERVIDOR PRODUCCIÓN
    server {
        listen 80;
        server_name fichaday.cticontrol.com;

        location /api/ {
            proxy_pass http://backend_prod;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://backend_prod;
        }
    }

    # SERVIDOR TEST
    server {
        listen 80;
        server_name fichadaytest.cticontrol.com;

        location /api/ {
            proxy_pass http://backend_test;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /health {
            add_header Content-Type text/plain;
            return 200 "healthy (test environment)\n";
        }
    }
}
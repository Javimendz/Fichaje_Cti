
services:

  db:
    image: postgres:14.3
    restart: always
    ports: 
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
    container_name: postgresDB_Fichaje
    env_file:
      - .env
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
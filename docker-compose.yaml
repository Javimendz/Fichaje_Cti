version: '3.8'

services:
  postgres:
    image: postgres:18
    restart: always
    container_name: postgres_db
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRESS_DB: ${DB_NAME}
      POSTGRESS_USERNAME: ${DB_USERNAME}
      POSTGRESS_HOST: ${DB_HOST}
    ports:
      - "5432:5432"
    volumes:
        - ./postgres-data:/var/lib/postgresql/data

